<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gallery — Ijal</title>
<meta name="description" content="Selected photography work by Ijal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="liquidGlass" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="turb">
      <animate attributeName="baseFrequency" values="0.010;0.020;0.010" dur="7s" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="turb" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="grain"></div>

<header id="siteHeader">
  <div class="wrap nav">
    <a href="index.html" class="logo">
      <img src="logo.svg" alt="Ijal" class="logo-img">
    </a>
    <div class="nav-right">
      <div class="toggle" id="themeToggle" role="button" aria-label="Toggle theme">
        <div class="knob"><svg id="knobIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></div>
      </div>
    </div>
  </div>
</header>

<main id="top">

  <section class="page-hero wrap">
    <div class="eyebrow reveal in"><span class="dot"></span>Gallery</div>
    <h1 class="reveal in">Frame by frame — the work so far.</h1>
  </section>

  <section class="section-pad wrap" style="padding-top:0;">
    <div class="filter-bar reveal" id="filterBar">
      <button class="active" data-filter="all">All</button>
      <button data-filter="portrait">Portrait</button>
      <button data-filter="landscape">Landscape</button>
      <button data-filter="event">Event</button>
      <button data-filter="street">Street</button>
    </div>

    <div class="gallery reveal" id="galleryGrid">
      <figure data-category="portrait" data-full="https://picsum.photos/seed/ijal-1/1200/1500"><img src="https://picsum.photos/seed/ijal-1/600/750" alt="Portrait shot" loading="lazy"><figcaption>Portrait · 2026</figcaption></figure>
      <figure data-category="landscape" data-full="https://picsum.photos/seed/ijal-2/1200/900"><img src="https://picsum.photos/seed/ijal-2/600/450" alt="Landscape shot" loading="lazy"><figcaption>Landscape · 2025</figcaption></figure>
      <figure data-category="street" data-full="https://picsum.photos/seed/ijal-3/1200/1600"><img src="https://picsum.photos/seed/ijal-3/600/800" alt="Candid street shot" loading="lazy"><figcaption>Candid · 2026</figcaption></figure>
      <figure data-category="event" data-full="https://picsum.photos/seed/ijal-4/1200/1200"><img src="https://picsum.photos/seed/ijal-4/600/600" alt="Event shot" loading="lazy"><figcaption>Event · 2025</figcaption></figure>
      <figure data-category="portrait" data-full="https://picsum.photos/seed/ijal-5/1200/1500"><img src="https://picsum.photos/seed/ijal-5/600/750" alt="Portrait shot" loading="lazy"><figcaption>Portrait · 2026</figcaption></figure>
      <figure data-category="street" data-full="https://picsum.photos/seed/ijal-6/1200/900"><img src="https://picsum.photos/seed/ijal-6/600/450" alt="Street shot" loading="lazy"><figcaption>Street · 2025</figcaption></figure>
      <figure data-category="landscape" data-full="https://picsum.photos/seed/ijal-7/1200/1600"><img src="https://picsum.photos/seed/ijal-7/600/800" alt="Landscape detail shot" loading="lazy"><figcaption>Detail · 2026</figcaption></figure>
      <figure data-category="event" data-full="https://picsum.photos/seed/ijal-8/1200/900"><img src="https://picsum.photos/seed/ijal-8/600/450" alt="Event shot" loading="lazy"><figcaption>Event · 2026</figcaption></figure>
      <figure data-category="portrait" data-full="https://picsum.photos/seed/ijal-9/1200/1500"><img src="https://picsum.photos/seed/ijal-9/600/750" alt="Portrait shot" loading="lazy"><figcaption>Portrait · 2025</figcaption></figure>
      <figure data-category="landscape" data-full="https://picsum.photos/seed/ijal-10/1200/900"><img src="https://picsum.photos/seed/ijal-10/600/450" alt="Landscape shot" loading="lazy"><figcaption>Landscape · 2026</figcaption></figure>
    </div>

    <p class="gallery-note reveal">These are placeholders — swap the <code>src</code>/<code>data-full</code> on each <code>&lt;figure&gt;</code> with your own photos, and adjust <code>data-category</code> so the filters keep working.</p>
  </section>

</main>

<footer class="wrap">
  <div class="footer-inner">
    <span>© 2026 Mayzal (Ijal). All photographs are my own.</span>
    <a href="#top" class="to-top">Back to top
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </a>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <div class="close" id="lightboxClose"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
  <img id="lightboxImg" src="" alt="Full size preview">
</div>

<div class="bottom-cluster">
<div class="player" id="player">
  <div class="player-bar" id="playerBar">
    <div class="player-cover"><img id="playerCover" src="" alt="Now playing cover"></div>
    <div class="player-meta">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-artist" id="playerArtist">—</div>
    </div>
    <div class="player-controls">
      <button id="prevBtn" aria-label="Previous track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg></button>
      <button id="playBtn" class="play" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="nextBtn" aria-label="Next track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg></button>
    </div>
    <div class="player-expand" id="playerExpand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>
  </div>
  <div class="player-progress" id="playerProgress"><div class="fill" id="progressFill"></div></div>
  <div class="player-list" id="playerList"></div>
</div>
<nav class="ios-tabbar" id="iosTabbar">
  <div class="tab-indicator" id="tabIndicator"></div>
  <a href="index.html" class="tab-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Home</span>
  </a>
  <a href="about.html" class="tab-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.8 4.4-5.8 7.5-5.8s6.1 2 7.5 5.8"/></svg>
    <span>About</span>
  </a>
  <a href="gallery.html" class="tab-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5"/></svg>
    <span>Gallery</span>
  </a>
  <a href="contact.html" class="tab-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h16v12H8l-4 4z"/></svg>
    <span>Contact</span>
  </a>
</nav>
</div>
<audio id="audioEl" preload="metadata"></audio>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
